---
- hosts: all
  become: yes
  tasks:
    - name: Create CNI bin directory
      file:
        path: /opt/cni/bin
        state: directory
        mode: '0755'

    - name: Download CNI plugins
      get_url:
        url: https://github.com/containernetworking/plugins/releases/download/v1.3.0/cni-plugins-linux-arm64-v1.3.0.tgz
        dest: /tmp/cni-plugins.tgz
        mode: '0644'

    - name: Extract CNI plugins
      unarchive:
        src: /tmp/cni-plugins.tgz
        dest: /opt/cni/bin
        remote_src: yes

    - name: Set permissions on CNI plugins
      file:
        path: /opt/cni/bin
        mode: '0755'
        recurse: yes

    - name: Clean up downloaded file
      file:
        path: /tmp/cni-plugins.tgz
        state: absent