---
- hosts: all
  become: yes
  tasks:
    - name: Create Flannel recovery script
      copy:
        dest: /usr/local/bin/flannel-recovery.sh
        content: |
          #!/bin/bash
          # Flannel Recovery Script - Ensures Flannel starts properly after reboot
          
          # Wait for kubelet to be ready
          timeout=300  # 5 minutes
          count=0
          while ! systemctl is-active --quiet kubelet && [ $count -lt $timeout ]; do
            echo "Waiting for kubelet to start... ($count/$timeout)"
            sleep 5
            ((count+=5))
          done
          
          # Wait for API server to be responsive
          count=0
          while ! kubectl get nodes &>/dev/null && [ $count -lt $timeout ]; do
            echo "Waiting for API server... ($count/$timeout)"
            sleep 5
            ((count+=5))
          done
          
          # Ensure node is untainted for single-node setup
          kubectl taint nodes --all node-role.kubernetes.io/control-plane- &>/dev/null || true
          
          # Clean up Unknown status pods
          kubectl get pods -A --field-selector=status.phase=Unknown --no-headers 2>/dev/null | while read namespace pod rest; do
            if [ ! -z "$pod" ]; then
              echo "Cleaning up Unknown pod: $namespace/$pod"
              kubectl delete pod "$pod" -n "$namespace" --force --grace-period=0 &>/dev/null || true
            fi
          done
          
          echo "Post-reboot recovery completed"
        mode: '0755'

    - name: Create post-reboot recovery systemd service
      copy:
        dest: /etc/systemd/system/k8s-post-reboot-recovery.service
        content: |
          [Unit]
          Description=Kubernetes Post-Reboot Recovery
          After=kubelet.service network-online.target
          Wants=kubelet.service
          
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/flannel-recovery.sh
          RemainAfterExit=yes
          StandardOutput=journal
          StandardError=journal
          TimeoutStartSec=600
          
          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Enable post-reboot recovery service
      systemd:
        name: k8s-post-reboot-recovery.service
        enabled: yes
        daemon_reload: yes

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes