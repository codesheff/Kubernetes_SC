---
  - name: Remove conflicting Docker repository files
    ansible.builtin.file:
      path: "{{ item }}"
      state: absent
    loop:
      - /etc/apt/sources.list.d/docker.list
      - /etc/apt/sources.list.d/docker.sources
    become: yes

  - name: Clean apt cache
    ansible.builtin.apt:
      autoclean: yes
      autoremove: yes
    become: yes