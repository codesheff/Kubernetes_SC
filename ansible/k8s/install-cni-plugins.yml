---
- name: Install CNI plugins for Kubernetes
  hosts: all
  become: yes
  gather_facts: yes
  vars:
    cni_plugins_version: "v1.8.0"
    cni_plugins_url: "https://github.com/containernetworking/plugins/releases/download/{{ cni_plugins_version }}/cni-plugins-linux-arm64-{{ cni_plugins_version }}.tgz"
    
  tasks:

    - name: Create CNI bin directory
      file:
        path: /opt/cni/bin
        state: directory
        mode: '0755'

    - name: Check if CNI plugins are already installed
      stat:
        path: /opt/cni/bin/loopback
      register: cni_plugins_check

    - name: Install CNI plugins
      block:
        - name: Download CNI plugins
          get_url:
            url: "{{ cni_plugins_url }}"
            dest: /tmp/cni-plugins.tgz
            mode: '0644'

        - name: Extract CNI plugins
          unarchive:
            src: /tmp/cni-plugins.tgz
            dest: /opt/cni/bin
            remote_src: yes
            mode: '0755'
            owner: root
            group: root

        - name: Verify CNI plugins installation
          shell: ls -la /opt/cni/bin/
          register: cni_verify

        - name: Display installed CNI plugins
          debug:
            msg: "{{ cni_verify.stdout_lines }}"

        - name: Clean up downloaded archive
          file:
            path: /tmp/cni-plugins.tgz
            state: absent

      when: not cni_plugins_check.stat.exists

    - name: Restart containerd to pick up CNI plugins
      systemd:
        name: containerd
        state: restarted

    - name: Restart kubelet to pick up CNI plugins
      systemd:
        name: kubelet
        state: restarted

    - name: Wait for services to be ready
      pause:
        seconds: 10

    - name: Final verification
      debug:
        msg: |
          CNI plugins installation complete!
          
          Installed plugins are available in /opt/cni/bin/
          - containerd and kubelet have been restarted
          - Pods should now be able to start properly
          
          Next steps:
          - Check if CoreDNS pods start running
          - Verify pod networking functionality