- name: Initialize master and worker nodes as root
  hosts: all
  become: yes
  gather_facts: yes
  tasks:

    - name: disable firewalld for labs (RHEL/CentOS)
      service:
        name: firewalld
        state: stopped
        enabled: false
      when: ansible_os_family == "RedHat"
      ignore_errors: yes

    - name: disable ufw for labs (Ubuntu/Debian)
      service:
        name: ufw
        state: stopped
        enabled: false
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Disable SWAP
      shell: |
        swapoff -a

    - name: Disable SWAP in fstab
      lineinfile:
        path: /etc/fstab
        regexp: '^.*swap.*$'
        line: '#\0'
        backrefs: yes

    - name: Load br_netfilter module
      modprobe:
        name: br_netfilter
        state: present

    - name: ensure net.bridge.bridge-nf-call-iptables is set to 1
      sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: '1'
        state: present

    - name: ensure net.bridge.bridge-nf-call-ip6tables is set to 1
      sysctl:
        name: net.bridge.bridge-nf-call-ip6tables
        value: '1'
        state: present


    - name: Installation of yum-utils (RHEL/CentOS)
      yum:
        name: yum-utils
        state: present
        update_cache: yes
      when: ansible_os_family == "RedHat"

    - name: Complete Docker repository cleanup (Ubuntu/Debian)
      shell: |
        # Remove all Docker repository files
        rm -f /etc/apt/sources.list.d/docker*.list
        rm -f /etc/apt/sources.list.d/*docker*
        # Remove Docker GPG keys
        rm -f /etc/apt/keyrings/docker*
        rm -f /usr/share/keyrings/docker*
        # Clean main sources list
        sed -i '/download\.docker\.com/d' /etc/apt/sources.list
        sed -i '/docker/d' /etc/apt/sources.list.d/*.list 2>/dev/null || true
        # Clean apt cache
        apt-get clean
        rm -rf /var/lib/apt/lists/*
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Create Docker keyring directory (Ubuntu/Debian)
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: ansible_os_family == "Debian"

    - name: Add Docker GPG key (Ubuntu/Debian)
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      when: ansible_os_family == "Debian"

    - name: Add Docker CE repository for Ubuntu/Debian
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      when: ansible_os_family == "Debian"

    - name: Installation of required packages (Ubuntu/Debian)
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes
        cache_valid_time: 0
      when: ansible_os_family == "Debian"

    - name: Add Docker CE repository for RHEL/CentOS
      yum_repository:
        name: docker-ce
        description: Docker CE Stable - $releasever
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        gpgcheck: yes
        gpgkey: https://download.docker.com/linux/centos/gpg
        enabled: yes
      when: ansible_os_family == "RedHat"

    - name: Complete Docker repository cleanup (Ubuntu/Debian)
      shell: |
        # Remove all Docker repository files
        rm -f /etc/apt/sources.list.d/docker*.list
        rm -f /etc/apt/sources.list.d/*docker*
        # Remove Docker GPG keys
        rm -f /etc/apt/keyrings/docker*
        rm -f /usr/share/keyrings/docker*
        # Clean main sources list
        sed -i '/download\.docker\.com/d' /etc/apt/sources.list
        sed -i '/docker/d' /etc/apt/sources.list.d/*.list 2>/dev/null || true
        # Clean apt cache
        apt-get clean
        rm -rf /var/lib/apt/lists/*
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Update apt cache after cleanup (Ubuntu/Debian)
      apt:
        update_cache: yes
        cache_valid_time: 0
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Create Docker keyring directory (Ubuntu/Debian)
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: ansible_os_family == "Debian"

    - name: Add Docker GPG key (Ubuntu/Debian)
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      when: ansible_os_family == "Debian"

    - name: Add Docker CE repository for Ubuntu/Debian
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      when: ansible_os_family == "Debian"

    - name: Update apt cache after adding Docker repository (Ubuntu/Debian)
      apt:
        update_cache: yes
        cache_valid_time: 0
      when: ansible_os_family == "Debian"

    - name: Installation of Docker on RHEL/CentOS
      yum:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes
      when: ansible_os_family == "RedHat"

    - name: Installation of Docker on Ubuntu/Debian
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"


    - name: Setting value of SystemdCgroup
      shell: |
        containerd config default | sudo tee /etc/containerd/config.toml | grep SystemdCgroup
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml

    - name : Starting Service of Docker
      service:
        name: docker
        state: started
        enabled: yes


    # - name: Add Kubernetes YUM repository for RHEL/CentOS
    #   yum_repository:
    #     name: kubernetes
    #     description: Kubernetes Repository
    #     baseurl: https://packages.cloud.google.com/yum/repos/kubernetes-el7-x86_64
    #     gpgcheck: yes
    #     repo_gpgcheck: yes
    #     gpgkey: https://packages.cloud.google.com/yum/doc/yum-key.gpg
    #         https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg
    #     enabled: yes

    - name: Add Kubernetes YUM repository for RHEL/CentOS
      shell: |
        cat <<EOF | sudo tee /etc/yum.repos.d/kubernetes.repo
        [kubernetes]
        name=Kubernetes
        baseurl=https://pkgs.k8s.io/core:/stable:/v1.33/rpm/
        enabled=1
        gpgcheck=1
        gpgkey=https://pkgs.k8s.io/core:/stable:/v1.33/rpm/repodata/repomd.xml.key
        EOF
      args:
        creates: /etc/yum.repos.d/kubernetes.repo
      when: ansible_os_family == "RedHat"

    - name: Add Kubernetes GPG key (Ubuntu/Debian)
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        chmod a+r /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      when: ansible_os_family == "Debian"

    - name: Add Kubernetes APT repository (Ubuntu/Debian)
      shell: |
        echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /" | tee /etc/apt/sources.list.d/kubernetes.list
      args:
        creates: /etc/apt/sources.list.d/kubernetes.list
      when: ansible_os_family == "Debian"

    - name: Update apt cache after adding Kubernetes repository (Ubuntu/Debian)
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"
    #         exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni


    - name: Install kubelet and kubeadm (RHEL/CentOS)
      yum:
        name:
          - kubelet
          - kubeadm
        state: present
        update_cache: yes
      when: ansible_os_family == "RedHat"

    - name: Install kubelet and kubeadm (Ubuntu/Debian)
      apt:
        name:
          - kubelet
          - kubeadm
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"






    - name: start kubelet
      service:
        name: kubelet
        enabled: yes
        state: started

    - name: Install kubectl (RHEL/CentOS)
      yum:
        name: kubectl
        state: present
      when: "'masters' in group_names and ansible_os_family == 'RedHat'"

    - name: Install kubectl (Ubuntu/Debian)
      apt:
        name: kubectl
        state: present
      when: "'masters' in group_names and ansible_os_family == 'Debian'"