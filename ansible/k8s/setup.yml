

- name: Initialize control and worker nodes as root
  hosts: all
  become: yes
  gather_facts: yes
  tasks:

    - name: Disable firewalld for labs (RHEL/CentOS)
      service:
        name: firewalld
        state: stopped
        enabled: false
      when: ansible_os_family == "RedHat"
      ignore_errors: yes

    - name: Disable ufw firewall for labs (Ubuntu/Debian)
      ufw:
        state: disabled
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Disable SWAP
      shell: |
        swapoff -a

    - name: Disable SWAP in fstab
      lineinfile:
        path: /etc/fstab
        regexp: '^.*swap.*$'
        line: '#\0'
        backrefs: yes

    - name: Ensure br_netfilter module is loaded
      modprobe:
        name: br_netfilter
        state: present

    - name: Ensure br_netfilter module loads on boot
      lineinfile:
        path: /etc/modules-load.d/k8s.conf
        line: br_netfilter
        create: yes

    - name: ensure net.bridge.bridge-nf-call-iptables is set to 1
      sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: '1'
        state: present
        reload: yes

    - name: ensure net.bridge.bridge-nf-call-ip6tables is set to 1
      sysctl:
        name: net.bridge.bridge-nf-call-ip6tables
        value: '1'
        state: present
        reload: yes

    - name: ensure net.ipv4.ip_forward is set to 1
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes


    - name: Installation of yum-utils (RHEL/CentOS)
      yum:
        name: yum-utils
        state: present
        update_cache: yes
      when: ansible_os_family == "RedHat"

    - name: Update apt package cache (Ubuntu/Debian)
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install required packages (Ubuntu/Debian)
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
      when: ansible_os_family == "Debian"



    - name: Add Docker CE repository for RHEL/CentOS
      yum_repository:
        name: docker-ce
        description: Docker CE Stable - $releasever
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        gpgcheck: yes
        gpgkey: https://download.docker.com/linux/centos/gpg
        enabled: yes
      when: ansible_os_family == "RedHat"

    - name: Create keyrings directory (Ubuntu/Debian)
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: ansible_os_family == "Debian"

    - name: Add Docker GPG key (Ubuntu/Debian)
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
      when: ansible_os_family == "Debian"

    - name: Add Docker repository (Ubuntu/Debian)
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list
      when: ansible_os_family == "Debian"

    - name: Installation of Docker on RHEL/CentOS
      yum:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes
      when: ansible_os_family == "RedHat"

    - name: Installation of Docker on Ubuntu/Debian
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Verify containerd service file exists
      stat:
        path: /lib/systemd/system/containerd.service
      register: containerd_service_file

    - name: Reinstall containerd if service file is missing (Ubuntu/Debian)
      package:
        name: containerd
        state: present
        force: yes
      when: ansible_os_family == "Debian" and not containerd_service_file.stat.exists

    - name: Reload systemd daemon if containerd was reinstalled
      systemd:
        daemon_reload: yes
      when: not containerd_service_file.stat.exists

    - name: Start and enable containerd service
      service:
        name: containerd
        state: started
        enabled: yes

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create containerd configuration directory
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Configure containerd for systemd cgroup driver
      shell: |
        containerd config default | sudo tee /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
        sed -i 's|sandbox_image = "registry.k8s.io/pause:3.8"|sandbox_image = "registry.k8s.io/pause:3.10"|g' /etc/containerd/config.toml
      register: containerd_config_result
      failed_when: containerd_config_result.rc != 0

    - name: Restart containerd after configuration
      service:
        name: containerd
        state: restarted


    # - name: Add Kubernetes YUM repository for RHEL/CentOS
    #   yum_repository:
    #     name: kubernetes
    #     description: Kubernetes Repository
    #     baseurl: https://packages.cloud.google.com/yum/repos/kubernetes-el7-x86_64
    #     gpgcheck: yes
    #     repo_gpgcheck: yes
    #     gpgkey: https://packages.cloud.google.com/yum/doc/yum-key.gpg
    #         https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg
    #     enabled: yes

    - name: Add Kubernetes YUM repository for RHEL/CentOS
      shell: |
        cat <<EOF | sudo tee /etc/yum.repos.d/kubernetes.repo
        [kubernetes]
        name=Kubernetes
        baseurl=https://pkgs.k8s.io/core:/stable:/v1.33/rpm/
        enabled=1
        gpgcheck=1
        gpgkey=https://pkgs.k8s.io/core:/stable:/v1.33/rpm/repodata/repomd.xml.key
        EOF
      args:
        creates: /etc/yum.repos.d/kubernetes.repo
      when: ansible_os_family == "RedHat"

    - name: Add Kubernetes GPG key (Ubuntu/Debian)
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        chmod a+r /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      when: ansible_os_family == "Debian"

    - name: Add Kubernetes repository (Ubuntu/Debian)
      shell: |
        echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /' | sudo tee /etc/apt/sources.list.d/kubernetes.list
      args:
        creates: /etc/apt/sources.list.d/kubernetes.list
      when: ansible_os_family == "Debian"

    - name: Update apt cache after adding repositories (Ubuntu/Debian)
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"
    #         exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni


    - name: Install kubelet and kubeadm (RHEL/CentOS)
      yum:
        name:
          - kubelet
          - kubeadm
        state: present
        update_cache: yes
      when: ansible_os_family == "RedHat"

    - name: Install kubelet and kubeadm (Ubuntu/Debian)
      apt:
        name:
          - kubelet
          - kubeadm
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Hold kubelet and kubeadm packages (Ubuntu/Debian)
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
      when: ansible_os_family == "Debian"

    - name: Reload systemd daemon to pickup kubelet service
      systemd:
        daemon_reload: yes

    - name: Verify kubelet service file exists
      stat:
        path: /lib/systemd/system/kubelet.service
      register: kubelet_service_file

    - name: Debug kubelet service file status
      debug:
        msg: "Kubelet service file exists: {{ kubelet_service_file.stat.exists }}"

    - name: Reinstall kubelet if service file is missing (Ubuntu/Debian)
      package:
        name: kubelet
        state: present
        force: yes
      when: ansible_os_family == "Debian" and not kubelet_service_file.stat.exists
      register: kubelet_reinstalled

    - name: Reload systemd daemon again after potential reinstall
      systemd:
        daemon_reload: yes
      when: kubelet_reinstalled is changed

    - name: Verify kubelet service file exists after potential reinstall
      stat:
        path: /lib/systemd/system/kubelet.service
      register: kubelet_service_final
      when: kubelet_reinstalled is changed

    - name: Fail if kubelet service file still missing after reinstall
      fail:
        msg: "Kubelet service file is still missing after reinstall. Manual intervention required."
      when: kubelet_reinstalled is changed and not kubelet_service_final.stat.exists

    - name: Enable kubelet service (it will fail to start until kubeadm init)
      service:
        name: kubelet
        enabled: yes
      register: kubelet_enable_result

    - name: Verify kubelet service is enabled
      command: systemctl is-enabled kubelet
      register: kubelet_enabled_check
      ignore_errors: yes

    - name: Debug kubelet enable status
      debug:
        msg: 
          - "Kubelet enable result: {{ kubelet_enable_result }}"
          - "Kubelet enabled check: {{ kubelet_enabled_check.stdout if kubelet_enabled_check.rc == 0 else 'Failed to check' }}"

    - name: Force enable kubelet if previous attempt failed
      command: systemctl enable kubelet
      when: kubelet_enabled_check.rc != 0 or kubelet_enabled_check.stdout != "enabled"
      ignore_errors: yes

    - name: Install kubectl (RHEL/CentOS)
      yum:
        name: kubectl
        state: present
      when: "'masters' in group_names and ansible_os_family == 'RedHat'"

    - name: Install kubectl (Ubuntu/Debian)
      apt:
        name: kubectl
        state: present
      when: "'masters' in group_names and ansible_os_family == 'Debian'"

    - name: Hold kubectl package (Ubuntu/Debian)
      dpkg_selections:
        name: kubectl
        selection: hold
      when: "'masters' in group_names and ansible_os_family == 'Debian'"