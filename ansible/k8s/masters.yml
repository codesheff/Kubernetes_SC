    #   args:
    #     chdir: /home/{{ ansible_user }}

    - name: Remove control node taint to allow scheduling on master
      become: yes
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      shell: kubectl taint nodes control node-role.kubernetes.io/control-plane-
      when: "'masters' in group_names"



