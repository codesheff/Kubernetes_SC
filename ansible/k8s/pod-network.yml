---
- name: Install and configure Kubernetes pod network (CNI)
  hosts: masters
  become: yes
  gather_facts: yes
  vars:
    # CNI solution options: calico, flannel, weave, cilium
    cni_solution: "calico"
    
    # Calico configuration
    calico_version: "v3.28.2"
    calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml"
    calico_custom_resources_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/custom-resources.yaml"
    
    # Flannel configuration
    flannel_version: "v0.25.6"
    flannel_manifest_url: "https://github.com/flannel-io/flannel/releases/download/{{ flannel_version }}/kube-flannel.yml"
    
    # Pod network CIDR (should match kubeadm init --pod-network-cidr)
    pod_network_cidr: "10.244.0.0/16"
    
  tasks:

    - name: Ensure .kube directory exists for kubectl access
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Ensure kubeconfig is available for user
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
        remote_src: yes

    - name: Wait for Kubernetes API to be ready
      uri:
        url: "https://{{ ansible_default_ipv4.address }}:6443/api/v1/nodes"
        method: GET
        headers:
          Authorization: "Bearer {{ kubeconfig_token | default('') }}"
        validate_certs: no
        status_code: [200, 401, 403]
      register: api_check
      until: api_check.status in [200, 401, 403]
      retries: 30
      delay: 10
      ignore_errors: yes

    - name: Check if any CNI is already installed
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl get pods -n kube-system | grep -E "(calico|flannel|weave|cilium)" || echo "no-cni-found"
      register: existing_cni
      changed_when: false
      failed_when: false

    - name: Display existing CNI status
      debug:
        msg: "Existing CNI check result: {{ existing_cni.stdout }}"

    - name: Remove existing CNI if different from desired
      block:
        - name: Get existing CNI deployments
          shell: |
            export KUBECONFIG=/etc/kubernetes/admin.conf
            kubectl get deployments,daemonsets -A -o name | grep -E "(calico|flannel|weave|cilium)" || true
          register: existing_deployments
          
        - name: Delete existing CNI resources
          shell: |
            export KUBECONFIG=/etc/kubernetes/admin.conf
            kubectl delete {{ item }}
          loop: "{{ existing_deployments.stdout_lines }}"
          when: 
            - existing_deployments.stdout_lines | length > 0
            - existing_cni.stdout != "no-cni-found"
            - cni_solution not in existing_cni.stdout
          ignore_errors: yes
          
      when: 
        - existing_cni.stdout != "no-cni-found"
        - cni_solution not in existing_cni.stdout

    # Calico Installation
    - name: Install Calico CNI
      block:
        - name: Download Calico Tigera operator manifest
          get_url:
            url: "{{ calico_manifest_url }}"
            dest: "/tmp/tigera-operator.yaml"
            mode: '0644'

        - name: Apply Calico Tigera operator
          shell: |
            export KUBECONFIG=/etc/kubernetes/admin.conf
            kubectl apply -f /tmp/tigera-operator.yaml
          register: calico_operator_result

        - name: Download Calico custom resources manifest
          get_url:
            url: "{{ calico_custom_resources_url }}"
            dest: "/tmp/calico-custom-resources.yaml"
            mode: '0644'

        - name: Modify Calico custom resources for pod CIDR
          replace:
            path: "/tmp/calico-custom-resources.yaml"
            regexp: '192\.168\.0\.0/16'
            replace: "{{ pod_network_cidr }}"
          when: pod_network_cidr != "192.168.0.0/16"

        - name: Apply Calico custom resources
          shell: |
            export KUBECONFIG=/etc/kubernetes/admin.conf
            kubectl apply -f /tmp/calico-custom-resources.yaml
          register: calico_resources_result

        - name: Wait for Calico pods to be ready
          shell: |
            export KUBECONFIG=/etc/kubernetes/admin.conf
            kubectl wait --for=condition=Ready pods -l app.kubernetes.io/name=calico-node -n calico-system --timeout=300s
          register: calico_wait_result
          until: calico_wait_result.rc == 0
          retries: 3
          delay: 30

      when: cni_solution == "calico"

    # Flannel Installation
    - name: Install Flannel CNI
      block:
        - name: Download Flannel manifest
          get_url:
            url: "{{ flannel_manifest_url }}"
            dest: "/tmp/kube-flannel.yml"
            mode: '0644'

        - name: Modify Flannel manifest for pod CIDR (if needed)
          replace:
            path: "/tmp/kube-flannel.yml"
            regexp: '10\.244\.0\.0/16'
            replace: "{{ pod_network_cidr }}"
          when: pod_network_cidr != "10.244.0.0/16"

        - name: Apply Flannel manifest
          shell: |
            export KUBECONFIG=/etc/kubernetes/admin.conf
            kubectl apply -f /tmp/kube-flannel.yml
          register: flannel_result

        - name: Wait for Flannel pods to be ready
          shell: |
            export KUBECONFIG=/etc/kubernetes/admin.conf
            kubectl wait --for=condition=Ready pods -l app=flannel -n kube-flannel --timeout=300s
          register: flannel_wait_result
          until: flannel_wait_result.rc == 0
          retries: 3
          delay: 30

      when: cni_solution == "flannel"

    # Weave Installation
    - name: Install Weave CNI
      block:
        - name: Apply Weave manifest
          shell: |
            export KUBECONFIG=/etc/kubernetes/admin.conf
            kubectl apply -f https://github.com/weaveworks/weave/releases/download/v2.8.1/weave-daemonset-k8s.yaml
          register: weave_result

        - name: Wait for Weave pods to be ready
          shell: |
            export KUBECONFIG=/etc/kubernetes/admin.conf
            kubectl wait --for=condition=Ready pods -l name=weave-net -n kube-system --timeout=300s
          register: weave_wait_result
          until: weave_wait_result.rc == 0
          retries: 3
          delay: 30

      when: cni_solution == "weave"

    - name: Wait for all nodes to be ready
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl wait --for=condition=Ready nodes --all --timeout=300s
      register: nodes_ready_result
      until: nodes_ready_result.rc == 0
      retries: 3
      delay: 30

    - name: Verify CNI installation
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        echo "=== Nodes Status ==="
        kubectl get nodes -o wide
        echo -e "\n=== CNI Pods Status ==="
        kubectl get pods -n kube-system -o wide | grep -E "(calico|flannel|weave|cilium|coredns)" || true
        kubectl get pods -n calico-system -o wide || true
        kubectl get pods -n kube-flannel -o wide || true
        echo -e "\n=== CNI Network Status ==="
        kubectl get network-policies -A || echo "No network policies found"
      register: cni_verification

    - name: Display CNI verification results
      debug:
        msg: "{{ cni_verification.stdout_lines }}"

    - name: Test pod connectivity (create test pod)
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl run test-pod --image=busybox --restart=Never --rm -i --tty -- /bin/sh -c "echo 'CNI test completed successfully'; nslookup kubernetes.default"
      register: connectivity_test
      ignore_errors: yes

    - name: Display connectivity test results
      debug:
        msg: "Connectivity test: {{ connectivity_test.stdout if connectivity_test.rc == 0 else 'Test failed: ' + connectivity_test.stderr }}"

    - name: Clean up temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/tigera-operator.yaml
        - /tmp/calico-custom-resources.yaml
        - /tmp/kube-flannel.yml
      ignore_errors: yes

    - name: Configure kubectl for user access
      shell: |
        echo 'export KUBECONFIG=$HOME/.kube/config' >> /home/{{ ansible_user }}/.bashrc
        echo 'alias k=kubectl' >> /home/{{ ansible_user }}/.bashrc
      args:
        creates: /home/{{ ansible_user }}/.kube/config_configured

    - name: Create kubectl config marker
      file:
        path: /home/{{ ansible_user }}/.kube/config_configured
        state: touch
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Final cluster status
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        echo "=== Final Cluster Status ==="
        kubectl cluster-info
        echo -e "\n=== Node Status ==="
        kubectl get nodes
        echo -e "\n=== System Pods ==="
        kubectl get pods -n kube-system
        echo -e "\n=== CNI-specific Pods ==="
        kubectl get pods -A | grep -E "(calico|flannel|weave|cilium)" || echo "No CNI pods with standard names found"
      register: final_status

    - name: Display final cluster status
      debug:
        msg: "{{ final_status.stdout_lines }}"

    - name: Summary message
      debug:
        msg: |
          ============================================
          Pod Network Installation Complete!
          ============================================
          CNI Solution: {{ cni_solution }}
          Pod Network CIDR: {{ pod_network_cidr }}
          
          Your Kubernetes cluster is now ready with pod networking!
          
          To use kubectl as {{ ansible_user }}:
          1. source ~/.bashrc  (to get kubectl alias and KUBECONFIG)
          2. kubectl get nodes
          3. kubectl get pods -A
          
          Next steps:
          - Add worker nodes to the cluster (if needed)
          - Deploy your applications
          - Configure ingress controllers or load balancers
          ============================================