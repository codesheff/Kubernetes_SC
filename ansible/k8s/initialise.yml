
- name: Initialize Kubernetes control plane and configure kubectl
  hosts: masters
  become: yes
  gather_facts: yes
  tasks:
    
    - name: Check if Kubernetes is already initialized
      stat:
        path: /etc/kubernetes/manifests/kube-apiserver.yaml
      register: k8s_initialized

    - name: Reset Kubernetes if already initialized
      shell: kubeadm reset -f
      when: k8s_initialized.stat.exists
      ignore_errors: yes

    - name: Clean up existing Kubernetes directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes
        - /var/lib/etcd
        - /var/lib/kubelet
        - /etc/cni/net.d
      when: k8s_initialized.stat.exists

    - name: Stop and reset kubelet
      systemd:
        name: kubelet
        state: stopped
      when: k8s_initialized.stat.exists
      ignore_errors: yes

    - name: Enable memory cgroup in boot config (Raspberry Pi)
      lineinfile:
        path: /boot/firmware/cmdline.txt
        regexp: '^((?!.*cgroup_enable=memory).*)'
        line: '\1 cgroup_enable=memory cgroup_memory=1'
        backrefs: yes
      when: ansible_machine == "aarch64" or ansible_machine == "armv7l"
      register: boot_config_changed

    - name: Enable memory cgroup in current boot config (Raspberry Pi)
      lineinfile:
        path: /boot/firmware/current/cmdline.txt
        regexp: '^((?!.*cgroup_enable=memory).*)'
        line: '\1 cgroup_enable=memory cgroup_memory=1'
        backrefs: yes
      when: ansible_machine == "aarch64" or ansible_machine == "armv7l"
      register: current_boot_config_changed
      ignore_errors: yes

    - name: Enable memory cgroup in boot config (x86_64)
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT="(.*)"'
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="\1 cgroup_enable=memory cgroup_memory=1"'
        backrefs: yes
      when: ansible_machine == "x86_64"
      register: grub_updated

    - name: Update GRUB (x86_64)
      command: update-grub
      when: ansible_machine == "x86_64" and grub_updated.changed

    - name: Reboot system if boot config changed
      reboot:
        reboot_timeout: 300
        test_command: systemctl is-system-running --wait
      when: boot_config_changed.changed or (grub_updated is defined and grub_updated.changed) or (current_boot_config_changed is defined and current_boot_config_changed.changed)

    - name: Configure containerd for systemd cgroup driver
      shell: |
        containerd config default | sudo tee /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
        sed -i 's|sandbox_image = "registry.k8s.io/pause:3.8"|sandbox_image = "registry.k8s.io/pause:3.10"|g' /etc/containerd/config.toml

    - name: Restart containerd service
      systemd:
        name: containerd
        state: restarted
        enabled: yes

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and restart kubelet service (ignore errors as it may fail until cluster init)
      systemd:
        name: kubelet
        state: restarted
        enabled: yes
      ignore_errors: yes

    - name: Set control IP from inventory or auto-detect
      set_fact:
        control_ip: "{{ ansible_host | default(ansible_default_ipv4.address, true) }}"

    - name: Fallback IP detection if needed
      shell: ip route get 8.8.8.8 | grep -oP 'src \K[^ ]+'
      register: fallback_ip
      when: control_ip is not defined or control_ip == "" or control_ip == "control"

    - name: Use fallback IP if primary detection failed
      set_fact:
        control_ip: "{{ fallback_ip.stdout.strip() }}"
      when: 
        - fallback_ip is defined
        - fallback_ip.stdout is defined
        - fallback_ip.stdout != ""
        - (control_ip is not defined or control_ip == "" or control_ip == "control")

    - name: Display detected control IP
      debug:
        msg: "Using control IP: {{ control_ip }}"

    - name: Verify IP is valid
      fail:
        msg: "Could not detect a valid IP address. Detected: {{ control_ip }}"
      when: control_ip == "" or control_ip == "control" or control_ip is not match("^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$")

    - name: Initialize Kubernetes Cluster
      shell: |
        kubeadm init \
          --pod-network-cidr=10.244.0.0/16 \
          --apiserver-advertise-address={{ control_ip }} \
          --upload-certs \
          --ignore-preflight-errors=SystemVerification
      register: kubeadm_output

    - name: Display kubeadm output
      debug:
        var: kubeadm_output.stdout_lines

    - name: create .kube directory and copy kube config file
      shell: "{{ item }}"
      loop:
        -  mkdir -p /home/{{ ansible_user }}/.kube                                    # Create user kubectl directory
        -  cp -f /etc/kubernetes/admin.conf /home/{{ ansible_user }}/.kube/config     # Copy admin config for user
        -  chown -R {{ ansible_user }}:{{ ansible_user }} /home/{{ ansible_user }}/.kube/                     # Set proper ownership

    - name: Copy kubeconfig to local machine
      fetch:
        src: /etc/kubernetes/admin.conf
        dest: ./kubeconfig
        flat: yes

    - name: Wait for control plane to be ready
      wait_for:
        port: 6443
        host: "{{ control_ip }}"
        delay: 30
        timeout: 300

  handlers:
    - name: reboot_system
      reboot:
        reboot_timeout: 300
        test_command: systemctl is-system-running
