---
- name: Reset and uninstall Kubernetes cluster components
  hosts: all
  become: true
  tasks:

    - name: Ensure python3-pip is installed (Ubuntu/Debian)
      package:
        name: 
          - python3-pip
          - python3-kubernetes
        state: present
      when: ansible_os_family == "Debian"

    - name: Ensure python3-pip is installed (RHEL/CentOS)
      package:
        name: python3-pip
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install Kubernetes Python client library with pip (RHEL/CentOS only)
      pip:
        name: kubernetes
        executable: /usr/bin/pip3
        state: present
      when: ansible_os_family == "RedHat"

    # curl -skSL https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/v4.11.0/deploy/uninstall-driver.sh | bash -s v4.11.0 --
    # git clone https://github.com/kubernetes-csi/csi-driver-nfs.git
    # cd csi-driver-nfs
    # git checkout v4.11.0
    # ./deploy/uninstall-driver.sh v4.11.0 local

    # helm uninstall csi-driver-nfs -n kube-system
    # helm repo remove csi-driver-nfs

    - name: Delete Calico namespace if present
      kubernetes.core.k8s:
        state: absent
        kind: Namespace
        name: calico-system
      ignore_errors: yes

    - name: Delete MetalLB namespace if present
      kubernetes.core.k8s:
        state: absent
        kind: Namespace
        name: metallb-system
      ignore_errors: yes

    - name: Delete Calico CRDs
      shell: |
        kubectl get crd | grep 'calico' | awk '{print $1}' | xargs -r kubectl delete crd
      args:
        warn: false
      ignore_errors: yes

    - name: Delete MetalLB CRDs
      shell: |
        kubectl get crd | grep 'metallb' | awk '{print $1}' | xargs -r kubectl delete crd
      args:
        warn: false
      ignore_errors: yes

    - name: Delete kube-proxy DaemonSet in kube-system
      kubernetes.core.k8s:
        state: absent
        api_version: apps/v1
        kind: DaemonSet
        namespace: kube-system
        name: kube-proxy
      ignore_errors: yes

    - name: Remove leftover Calico network interfaces
      shell: |
        ip link delete cali-default || true
        ip link delete tunl0 || true
      ignore_errors: yes





    - name: Stop kubelet service
      ansible.builtin.systemd:
        name: kubelet
        state: stopped
        enabled: false
      ignore_errors: yes

    - name: Stop containerd service
      ansible.builtin.systemd:
        name: containerd
        state: stopped
        enabled: false
      ignore_errors: yes

    - name: Reset kubeadm cluster state (kubeadm reset)
      ansible.builtin.command:
        cmd: kubeadm reset -f
      ignore_errors: yes

    - name: Remove Kubernetes directory
      ansible.builtin.file:
        path: /etc/kubernetes
        state: absent
      ignore_errors: yes

    - name: Remove etcd data directory
      ansible.builtin.file:
        path: /var/lib/etcd
        state: absent
      ignore_errors: yes

    - name: Remove kubernetes directory under /var/lib
      ansible.builtin.file:
        path: /var/lib/kubelet
        state: absent
      ignore_errors: yes

    - name: Remove Kubernetes CNI configuration
      ansible.builtin.file:
        path: /etc/cni/net.d
        state: absent
      ignore_errors: yes

    - name: Remove admin kubeconfig from user home
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: absent
      ignore_errors: yes

    - name: Remove Kubernetes apt repo files (Ubuntu/Debian)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      ignore_errors: yes
      loop:
        - /etc/apt/sources.list.d/kubernetes.list
        - /etc/apt/sources.list.d/kubernetes-xenial.list
        - /etc/apt/keyrings/kubernetes-archive-keyring.gpg
        - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - /usr/share/keyrings/kubernetes-archive-keyring.gpg
      when: ansible_os_family == "Debian"

    - name: Remove Kubernetes yum repo file (RHEL/CentOS)
      ansible.builtin.file:
        path: /etc/yum.repos.d/kubernetes.repo
        state: absent
      ignore_errors: yes
      when: ansible_os_family == "RedHat"

    - name: Clean package caches based on OS family
      ansible.builtin.command: "{{ item }}"
      loop:
        - "{{ 'apt-get clean && apt-get autoremove -y' if ansible_os_family == 'Debian' else 'dnf clean all' }}"
      ignore_errors: yes

    - name: Remove installed Kubernetes packages (Ubuntu/Debian)
      ansible.builtin.package:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: absent
      ignore_errors: yes
      when: ansible_os_family == "Debian"

    - name: Remove installed Kubernetes packages (RHEL/CentOS)
      ansible.builtin.package:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: absent
      ignore_errors: yes
      when: ansible_os_family == "RedHat"

    - name: Remove Docker and containerd packages (Ubuntu/Debian)
      ansible.builtin.package:
        name:
          - docker.io
          - docker-ce
          - docker-ce-cli
          - docker-buildx-plugin
          - docker-compose-plugin
          - containerd
          - containerd.io
          - runc
        state: absent
      ignore_errors: yes
      when: ansible_os_family == "Debian"

    - name: Remove Docker and containerd packages (RHEL/CentOS)
      ansible.builtin.package:
        name:
          - docker-ce
          - docker-ce-cli
          - docker-buildx-plugin
          - docker-compose-plugin
          - containerd.io
          - runc
        state: absent
      ignore_errors: yes
      when: ansible_os_family == "RedHat"

    - name: Remove Docker CE repo (RHEL/CentOS)
      ansible.builtin.file:
        path: /etc/yum.repos.d/docker-ce.repo
        state: absent
      ignore_errors: yes
      when: ansible_os_family == "RedHat"

    - name: Remove Docker GPG key and repo (Ubuntu/Debian)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      ignore_errors: yes
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/keyrings/docker.gpg
        - /etc/apt/keyrings/docker-archive-keyring.gpg
        - /usr/share/keyrings/docker-archive-keyring.gpg
      when: ansible_os_family == "Debian"

    - name: Remove containerd config files
      ansible.builtin.file:
        path: /etc/containerd/config.toml
        state: absent
      ignore_errors: yes

    - name: Remove containerd config directory if empty
      ansible.builtin.file:
        path: /etc/containerd
        state: absent
      ignore_errors: yes

    - name: Remove CNI binaries directory
      ansible.builtin.file:
        path: /opt/cni/bin
        state: absent
      ignore_errors: yes

    - name: Remove Kubernetes logs (optional)
      ansible.builtin.file:
        path: /var/log/pods
        state: absent
      ignore_errors: yes

    - name: Remove kubelet service file and related systemd files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      ignore_errors: yes
      loop:
        - /etc/systemd/system/kubelet.service
        - /etc/systemd/system/kubelet.service.d
        - /lib/systemd/system/kubelet.service
        - /usr/lib/systemd/system/kubelet.service

    - name: Reload systemd daemon
      ansible.builtin.command: systemctl daemon-reload
      ignore_errors: yes

    - name: Remove swap off entry (optional cleanup)
      ansible.builtin.command: swapoff -a
      ignore_errors: yes

    - name: Restore boot cmdline (remove cgroup memory settings) on Raspberry Pi
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: '\s*cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory'
        replace: ''
      ignore_errors: yes
      when: ansible_architecture == "aarch64"

    - name: Restore boot cmdline (remove cgroup memory settings) on other systems
      ansible.builtin.replace:
        path: /boot/cmdline.txt
        regexp: '\s*cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory'
        replace: ''
      ignore_errors: yes
      when: ansible_architecture != "aarch64"

    - name: Uncomment swap entries in /etc/fstab (to enable swap again)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^#(\s*[^#]\S+\s+\S+\s+swap\s+)'
        replace: '\1'
      ignore_errors: yes

    - name: Remove additional Ubuntu/Debian specific directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      ignore_errors: yes
      loop:
        - /var/lib/docker
        - /var/lib/containerd
        - /run/containerd
        - /run/docker
        - /var/run/docker.sock
        - /var/run/containerd
        - /etc/docker
        - /etc/systemd/system/docker.service.d
        - /etc/systemd/system/containerd.service.d
      when: ansible_os_family == "Debian"

    - name: Remove Kubernetes Python client library (Ubuntu/Debian)
      package:
        name: python3-kubernetes
        state: absent
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Remove Kubernetes Python client library (RHEL/CentOS)
      pip:
        name: kubernetes
        executable: /usr/bin/pip3
        state: absent
      when: ansible_os_family == "RedHat"
      ignore_errors: yes

    - name: Update package cache (Ubuntu/Debian)
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Provide a summary
      ansible.builtin.debug:
        msg: "Kubernetes and related packages reset and cleaned on {{ inventory_hostname }} ({{ ansible_os_family }})"